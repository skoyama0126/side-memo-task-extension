<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side Memo</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="utility-bar">
        <div class="utility-actions">
          <button id="backup-export" class="utility-link-button" type="button">バックアップ書き出し</button>
          <button id="backup-import" class="utility-link-button" type="button">復元</button>
          <input id="backup-file-input" type="file" accept="application/json,.json" hidden />
        </div>
      </div>

      <nav class="tabs" aria-label="メインタブ">
        <button class="tab-button is-active" data-tab="memo" type="button">メモ</button>
        <button class="tab-button" data-tab="snippets" type="button">定型文</button>
        <button class="tab-button" data-tab="tasks" type="button">TODO</button>
        <button class="tab-button" data-tab="web" type="button">Web</button>
      </nav>

      <main>
        <section class="panel is-active panel--memo" data-panel="memo">
          <div class="memo-toolbar">
            <div id="memo-slot-list" class="memo-slot-list" aria-label="メモ一覧"></div>
            <div class="memo-toolbar__actions">
              <button id="memo-add" class="memo-tool-button memo-tool-button--add" type="button" aria-label="メモを追加">
                +
              </button>
              <button
                id="memo-remove"
                class="memo-tool-button memo-tool-button--remove"
                type="button"
                aria-label="選択中のメモを削除"
              >
                -
              </button>
            </div>
          </div>

          <label class="sr-only" for="memo-input">メモ本文</label>
          <textarea
            id="memo-input"
            class="memo-input memo-input--grid"
            placeholder="選択中のメモを書いてください"
          ></textarea>
        </section>

        <section class="panel" data-panel="snippets">
          <div class="panel-header">
            <button id="snippet-open-modal" class="memo-tool-button memo-tool-button--add" type="button">+</button>
          </div>
          <div id="snippet-list" class="stack-list"></div>
        </section>

        <section class="panel" data-panel="tasks">
          <form id="task-form" class="inline-form">
            <input id="task-input" type="text" maxlength="120" placeholder="新しいタスクを追加" required />
            <button class="memo-tool-button memo-tool-button--add" type="submit">+</button>
          </form>

          <div id="task-list" class="stack-list"></div>
        </section>

        <section class="panel" data-panel="web">
          <div class="panel-header">
            <button id="web-open-modal" class="memo-tool-button memo-tool-button--add" type="button">+</button>
          </div>
          <div id="web-list" class="stack-list"></div>
        </section>
      </main>
    </div>

    <template id="snippet-item-template">
      <article class="item-card">
        <div class="item-card__header">
          <button class="snippet-title-button" data-action="copy" type="button"></button>
          <div class="item-card__inline-actions">
            <button class="icon-letter-button" data-action="edit" type="button" aria-label="編集">編</button>
            <button class="icon-letter-button" data-action="move-up" type="button" aria-label="上へ移動">↑</button>
            <button class="icon-letter-button" data-action="move-down" type="button" aria-label="下へ移動">↓</button>
            <button class="icon-letter-button icon-letter-button--danger" data-action="delete" type="button" aria-label="削除">×</button>
          </div>
        </div>
        <div class="item-card__body">
          <p></p>
        </div>
      </article>
    </template>

    <template id="task-item-template">
      <article class="task-row">
        <span class="task-row__label"></span>
        <div class="task-row__actions">
          <button class="icon-letter-button" data-action="move-up" type="button" aria-label="上へ移動">↑</button>
          <button class="icon-letter-button" data-action="move-down" type="button" aria-label="下へ移動">↓</button>
          <button class="danger-icon-button" data-action="delete" type="button" aria-label="削除">×</button>
        </div>
      </article>
    </template>

    <template id="web-item-template">
      <article class="item-card">
        <div class="item-card__header">
          <button class="snippet-title-button" data-action="open" type="button"></button>
          <div class="item-card__inline-actions">
            <button class="icon-letter-button" data-action="edit" type="button" aria-label="編集">編</button>
            <button class="icon-letter-button" data-action="move-up" type="button" aria-label="上へ移動">↑</button>
            <button class="icon-letter-button" data-action="move-down" type="button" aria-label="下へ移動">↓</button>
            <button class="icon-letter-button icon-letter-button--danger" data-action="delete" type="button" aria-label="削除">×</button>
          </div>
        </div>
        <div class="item-card__body">
          <p></p>
        </div>
      </article>
    </template>

    <div id="snippet-modal" class="modal" hidden>
      <div class="modal__backdrop" data-action="close-modal"></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="snippet-modal-title">
        <div class="modal__header">
          <h3 id="snippet-modal-title">定型文を追加</h3>
          <button id="snippet-modal-close" class="icon-letter-button" type="button" aria-label="閉じる">×</button>
        </div>
        <form id="snippet-form" class="card-form card-form--modal">
          <input type="hidden" id="snippet-edit-id" />
          <label>
            <span>タイトル</span>
            <input id="snippet-title" type="text" maxlength="60" placeholder="例: LP制作プロンプト" required />
          </label>
          <label>
            <span>本文</span>
            <textarea id="snippet-body" rows="6" maxlength="2000" placeholder="コピーしたい定型文を入力" required></textarea>
          </label>
          <div class="form-actions">
            <button class="primary-button" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="web-modal" class="modal" hidden>
      <div class="modal__backdrop" data-action="close-web-modal"></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="web-modal-title">
        <div class="modal__header">
          <h3 id="web-modal-title">Webを追加</h3>
          <button id="web-modal-close" class="icon-letter-button" type="button" aria-label="閉じる">×</button>
        </div>
        <form id="web-form" class="card-form card-form--modal">
          <input type="hidden" id="web-edit-id" />
          <label>
            <span>タイトル</span>
            <input id="web-title" type="text" maxlength="60" placeholder="例: ChatGPT" required />
          </label>
          <label>
            <span>URL</span>
            <input id="web-url" type="url" maxlength="2000" placeholder="https://example.com" required />
          </label>
          <div class="form-actions">
            <button class="primary-button" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
